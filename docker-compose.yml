services:
  db:
    image: postgres:16-alpine
    container_name: optimizer-db
    environment:
      POSTGRES_DB: optimizer
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer -d optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: optimizer-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/optimizer
      SPRING_DATASOURCE_USERNAME: optimizer
      SPRING_DATASOURCE_PASSWORD: optimizer
      PRICES_PATH: /data/prices.csv
      EGRESS_PATH: /data/egress.csv
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: optimizer-dashboard
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
