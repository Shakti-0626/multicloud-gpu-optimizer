spring:
  datasource:
    url: jdbc:h2:mem:optimizer_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  data:
    prices-path: ../data/prices.csv
    egress-path: ../data/egress.csv
