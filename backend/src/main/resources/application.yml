server:
  port: 8080

spring:
  application:
    name: multicloud-optimizer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optimizer}
    username: ${SPRING_DATASOURCE_USERNAME:optimizer}
    password: ${SPRING_DATASOURCE_PASSWORD:optimizer}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  data:
    prices-path: ${PRICES_PATH:../data/prices.csv}
    egress-path: ${EGRESS_PATH:../data/egress.csv}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.multicloud.optimizer: DEBUG
